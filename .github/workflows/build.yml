name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Cheia de semnare
        env: { KS_B64: '${{ secrets.KS_B64 }}' }
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/summit.p12"
      - name: Teste și APK
        env:
          KS_FILE: ${{ runner.temp }}/summit.p12
          KS_PASS: ${{ secrets.KS_PASS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.${{ github.run_number }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/release/app-release.apk summit-sync.apk
          gh release create "b${{ github.run_number }}" summit-sync.apk --target "$GITHUB_SHA" \
            --title "Summit Sync 0.${{ github.run_number }}" --notes "Commit ${{ github.sha }}" --latest
